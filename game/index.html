<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERWATCH — build by day, hold by night: 9 nights, 7 creatures, 6 crafts, 4 rescues, boss The Thicket Warden</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a07; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #12241a; cursor: pointer; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; height: 46px;
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    color: #ffe9b8; font-size: 15.5px; letter-spacing: .03em;
    background: linear-gradient(180deg, rgba(4,8,5,.9), rgba(4,8,5,.55) 70%, rgba(4,8,5,0));
    pointer-events: none; text-shadow: 0 1px 3px #000;
  }
  #hud .lab { color: #b9a8e8; font-size: 11px; text-transform: uppercase; letter-spacing: .16em; margin-right: 5px; }
  #hud .val { font-weight: bold; }
  .barwrap { flex: 0 0 92px; height: 9px; border: 1px solid #6b5a3a; border-radius: 5px; background: rgba(16,12,6,.85); overflow: hidden; display: inline-block; vertical-align: middle; }
  .barwrap > span { display: block; height: 100%; transition: width .2s; }
  #h-fuelbar { background: linear-gradient(90deg, #e05a1c, #ffb347); width: 78%; }
  #h-hpbar { background: linear-gradient(90deg, #a82c2c, #e05a5a); width: 100%; }
  #h-foodbar { background: linear-gradient(90deg, #7a9a2e, #b6d94d); width: 100%; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 84px; text-align: center;
    color: #ffe9b8; font-size: 14.5px; pointer-events: none; text-shadow: 0 1px 4px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span><span class="lab">Night</span><span class="val" id="h-night">–</span></span>
    <span><span class="val" id="h-phase">EMBERWATCH</span></span>
    <span><span class="lab">Fire</span><span class="barwrap"><span id="h-fuelbar"></span></span></span>
    <span><span class="lab">Health</span><span class="barwrap"><span id="h-hpbar"></span></span></span>
    <span><span class="lab">Hunger</span><span class="barwrap"><span id="h-foodbar"></span></span></span>
    <span><span class="val" id="h-haul">🪵 0 ⛏ 0 🫐 0</span></span>
    <span><span class="val" id="h-rescue">Campers 0/4</span></span>
    <span><span class="lab">Score</span><span class="val" id="h-score">0</span></span>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
